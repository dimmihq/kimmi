# Publishes a release: pushing a version tag such as v0.1.0 releases the
# tagged commit.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# It publishes:
#   ghcr.io/dimmihq/kimmi:<version> and :latest   amd64 and arm64
#   a GitHub Release with the kimmi binary for Linux and macOS on amd64 and
#   arm64 (dashboard and SDK embedded), kimmi.js and checksums
#
# A version with a suffix, such as v0.2.0-rc.1, is a prerelease: it never
# moves :latest.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
          {
            echo "NUMBER=${VERSION#v}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=true"; else echo "PRERELEASE=false"; fi
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the dashboard and the SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kimmi/browser build
          pnpm --filter @kimmi/web build
          rm -rf internal/webui/dist && mkdir -p internal/webui/dist
          cp -R web/dist/. internal/webui/dist/
          cp sdk/browser/dist/kimmi.js internal/webui/dist/kimmi.js
          cp sdk/browser/dist/kimmi-feedback.js internal/webui/dist/kimmi-feedback.js
      - name: Test
        run: go test -count=1 ./...
      - name: Build the binaries
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$NUMBER -X main.commit=$COMMIT" \
              -o "out/kimmi" ./cmd/kimmi
            tar -C out -czf "out/kimmi_${NUMBER}_${os}_${arch}.tar.gz" kimmi
            rm out/kimmi
          done
          cp sdk/browser/dist/kimmi.js out/kimmi.js
          (cd out && sha256sum * > checksums.txt)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        run: |
          tags="ghcr.io/dimmihq/kimmi:$NUMBER"
          if [ "$PRERELEASE" = false ]; then tags="$tags,ghcr.io/dimmihq/kimmi:latest"; fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            VERSION=${{ env.NUMBER }}
            COMMIT=${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/dimmihq/kimmi
            org.opencontainers.image.version=${{ env.NUMBER }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the release
        run: |
          flags=(--title "$VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" out/* "${flags[@]}"
